name: Construieste VerTech Admin (Android)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin-app/**'
      - '.github/workflows/admin.yml'

jobs:
  admin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Pregatire
        working-directory: admin-app
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npx cap add android
          pip install pillow
          BUILD_NUM=${{ github.run_number }} python3 prepare.py
          npx cap sync android
      - name: Construieste APK
        working-directory: admin-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Redenumeste
        run: cp admin-app/android/app/build/outputs/apk/debug/app-debug.apk VerTech-Admin.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-${{ github.run_number }}
          name: VerTech Admin ${{ github.run_number }}
          prerelease: true
          make_latest: "false"
          files: VerTech-Admin.apk
