name: Construieste aplicatiile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'android-src/**'
      - 'electron/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/**'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Pregatire aplicatie
        run: |
          mkdir -p www
          cp app/trikker.html www/index.html
          sed -i "s/const APP_BUILD = 0;/const APP_BUILD = ${{ github.run_number }};/" www/index.html
          grep -c "const APP_BUILD = ${{ github.run_number }};" www/index.html
          npm install --no-audit --no-fund --ignore-scripts
          npx cap add android
          pip install pillow
          BUILD_NUM=${{ github.run_number }} python3 android-src/prepare_android.py
          npx cap sync android
      - name: Construieste APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Redenumeste
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Trikker-${{ github.run_number }}.apk
      - name: Verifica semnatura stabila
        run: |
          keytool -printcert -jarfile Trikker-${{ github.run_number }}.apk | tee cert.txt
          grep -q "78:BA:60:CC:FF:D8:0F:F3:67:11:6A:D2:01:A3:04:58:82:3D:F3:38:84:DB:3B:89:F5:E9:EF:74:77:0D:C9:09" cert.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Trikker-Android
          path: Trikker-${{ github.run_number }}.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pregatire si construire
        shell: bash
        run: |
          mkdir -p www
          cp app/trikker.html www/index.html
          sed -i "s/const APP_BUILD = 0;/const APP_BUILD = ${{ github.run_number }};/" www/index.html
          grep -c "const APP_BUILD = ${{ github.run_number }};" www/index.html
          npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
          npm install --no-audit --no-fund
          npx electron-builder --win --x64 --publish never
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: Trikker-Windows
          path: |
            dist/Trikker-Setup.exe
            dist/latest.yml
            dist/Trikker-Setup.exe.blockmap

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: versiunea-${{ github.run_number }}
          name: Versiunea ${{ github.run_number }}
          files: |
            out/Trikker-${{ github.run_number }}.apk
            out/Trikker-Setup.exe
            out/latest.yml
            out/Trikker-Setup.exe.blockmap
